[project]
name = "vference"
version = "0.1.0"
description = "Out-of-core inference runtime for oversized generative models on Apple Silicon"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "mlx==0.32.2",
  "mlx-lm==0.31.3",
  "numpy==2.3.2",
  "psutil==7.2.2",
  "safetensors==0.8.0",
]

[project.scripts]
vference = "vference.cli:main"

[dependency-groups]
dev = [
  "pytest==8.4.2",
  "ruff==0.12.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vference"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

